name: Compilar APK Beta
on:
  workflow_dispatch:
    inputs:
      project_repo:
        description: Repositorio publico (dono/repositorio)
        required: true
        type: string
      ref:
        description: Branch ou tag
        required: false
        default: main
        type: string
      module:
        description: Modulo Android sem dois pontos
        required: false
        default: app
        type: string
permissions:
  contents: read
jobs:
  build:
    name: Compilar Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.project_repo }}
          ref: ${{ inputs.ref }}
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Aumentar tempo de download
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i '/^networkTimeout=/d' gradle/wrapper/gradle-wrapper.properties
            echo 'networkTimeout=60000' >> gradle/wrapper/gradle-wrapper.properties
          fi
      - name: Compilar APK release
        env:
          GRADLE_OPTS: -Dorg.gradle.wrapper.networkTimeout=60000
        run: |
          chmod +x gradlew
          for tentativa in 1 2 3; do
            ./gradlew :${{ inputs.module }}:assembleRelease --no-daemon && exit 0
            [ $tentativa -eq 3 ] && exit 1
            sleep 15
          done
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-release
          path: '**/build/outputs/**/*.apk'
          if-no-files-found: error
          retention-days: 1"name: Compilar APK Beta
