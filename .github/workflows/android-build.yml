'name: Compilar APK (Beta)
on:
  workflow_dispatch:
    inputs:
      project_repo:
        description: Repositório público no formato dono/repositorio
        required: true
      ref:
        description: Branch ou tag
        required: false
        default: main
      module:
        description: Módulo Android sem dois-pontos
        required: false
        default: app
permissions:
  contents: read
jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Buscar projeto
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.project_repo }}
          ref: ${{ inputs.ref }}
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK release
        run: |
          chmod +x gradlew
          ./gradlew :${{ inputs.module }}:assembleRelease --no-daemon
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-release
          path: '**/build/outputs/**/*.apk'
          if-no-files-found: error
          retention-days: 1'
