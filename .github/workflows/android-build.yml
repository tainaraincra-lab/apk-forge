jobs:
  build:
    name: Compilar Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.project_repo }}
          ref: ${{ inputs.ref }}
      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Aumentar tempo de download
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i '/^networkTimeout=/d' gradle/wrapper/gradle-wrapper.properties
            echo 'networkTimeout=600000' >> gradle/wrapper/gradle-wrapper.properties
          fi
      - name: Compilar APK release
        env:
          GRADLE_OPTS: -Dorg.gradle.wrapper.networkTimeout=600000
        run: |
          chmod +x gradlew
          for tentativa in 1 2 3; do
            if ./gradlew :${{ inputs.module }}:assembleRelease --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$tentativa" -eq 3 ]; then
              exit 1
            fi
            sleep $((tentativa * 30))
          done
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-release
          path: '**/build/outputs/**/*.apk'
          if-no-files-found: error
          retention-days: 1
